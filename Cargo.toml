[package]
name = "xcom"
version = "0.9.2"
edition = "2024"
rust-version = "1.100.0"
description = "ATK-XCOM 风格串口调试助手 — 跨平台串口工具 (Rust + gpui-kit)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/example/xcom"
keywords = ["serial", "serialport", "uart", "gpui", "gui"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "xcom"
path = "src/main.rs"

[dependencies]
# One dependency for the window, theme, components and overlays.  GPUI is
# re-exported as `gpui_kit::*`; the component layer is `gpui_kit::component`.
gpui-kit = "=0.9.0"
serialport = "4.10"
regex = "1"
encoding_rs = "0.8"
chardetng = "1.0"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
chrono = "0.4"
fontdb = "0.24"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# UI integration tests render real gpui-kit components in headless windows.
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
# Used only by the Unix PTY loopback test, which needs `openpty`.
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
