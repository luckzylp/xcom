[package]
name = "xcom"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "ATK-XCOM 风格串口调试助手 — 跨平台串口工具 (Rust + egui)"
authors = ["xcom contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/example/xcom"
keywords = ["serial", "serialport", "uart", "egui", "gui"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "xcom"
path = "src/main.rs"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serialport = "4.10"
encoding_rs = "0.8"
chardetng = "1.0"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
chrono = "0.4"
fontdb = "0.24"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# Used only by the Unix PTY loopback test, which needs `openpty`.
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
