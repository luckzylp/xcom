name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting and lints only need to run once; they are platform independent.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libudev-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libudev-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev \
            fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  build:
    name: build (${{ matrix.target }}${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: glibc 2.17 baseline (zig)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: -glibc2.17
            zig_target: x86_64-unknown-linux-gnu.2.17
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: -glibc2.17
            zig_target: aarch64-unknown-linux-gnu.2.17
          # Linux: runner glibc (latest)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: -glibc-latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: -glibc-latest
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # macOS
          #- os: macos-13
          #  target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libudev-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev
      # Both published setup-zig actions still declare `runs.using: node20`,
      # which workflow_actions_run_on_node_24 rejects, so zig is fetched here.
      - name: Install zig
        if: matrix.zig_target
        shell: bash
        run: |
          set -euo pipefail
          version=0.16.0
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="zig-${arch}-linux-${version}.tar.xz"
          curl -fsSL "https://ziglang.org/download/${version}/${tarball}" -o "${RUNNER_TEMP}/${tarball}"
          tar -xJf "${RUNNER_TEMP}/${tarball}" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/zig-${arch}-linux-${version}" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        if: matrix.zig_target
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}${{ matrix.suffix }}
      - name: Build (Linux, glibc 2.17)
        if: matrix.zig_target
        env:
          # The runner's GUI shared libraries (xkbcommon, freetype, ...) were
          # built against a newer glibc than the 2.17 baseline the zig sysroot
          # provides, so lld refuses their undefined references.  Those
          # references live inside those libraries, not in this binary, and the
          # loader resolves them against the target machine's own copy: let the
          # link through instead of dropping the old-glibc artifact.
          RUSTFLAGS: -C link-arg=-Wl,--allow-shlib-undefined
        run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }}
      # The link above was allowed to skip the shared libraries' own
      # references, so prove it did not smuggle a newer glibc requirement into
      # the artifact: the file must still ask for nothing past 2.17.
      - name: Check the glibc symbol baseline
        if: matrix.zig_target
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/xcom"
          versions="$(readelf --version-info "$binary" | grep -o 'GLIBC_[0-9.]*' || true)"
          highest="$(printf '%s\n' "$versions" | sed 's/GLIBC_//' | grep . | sort -uV | tail -n 1 || true)"
          echo "highest glibc symbol required: ${highest:-none}"
          if [ -n "$highest" ] && [ "$(printf '%s\n2.17\n' "$highest" | sort -V | tail -n 1)" != "2.17" ]; then
            echo "::error::the artifact needs glibc ${highest}, above the 2.17 baseline"
            exit 1
          fi
      - name: Build
        if: ${{ !matrix.zig_target }}
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: xcom-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/xcom
            target/${{ matrix.target }}/release/xcom.exe
          if-no-files-found: ignore
