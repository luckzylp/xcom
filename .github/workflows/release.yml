name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux: glibc 2.17 baseline (zig) ───────────────────
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: -glibc2.17
            zig_target: x86_64-unknown-linux-gnu.2.17
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: -glibc2.17
            zig_target: aarch64-unknown-linux-gnu.2.17
          # ── Linux: runner glibc (latest) ───────────────────────
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: -glibc-latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: -glibc-latest
          # ── Windows ────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # ── macOS ─────────────────────────────────────────────
          #- os: macos-13
          #  target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── Install Linux GUI dependencies ─────────────────────────
      - name: Install Linux GUI dependencies (native)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libudev-dev

      # ── Install zig (glibc-version-pinned Linux builds) ────────
      # Both published setup-zig actions still declare `runs.using: node20`,
      # which workflow_actions_run_on_node_24 rejects, so zig is fetched here.
      - name: Install zig
        if: matrix.zig_target
        shell: bash
        run: |
          set -euo pipefail
          version=0.16.0
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64) arch=aarch64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="zig-${arch}-linux-${version}.tar.xz"
          curl -fsSL "https://ziglang.org/download/${version}/${tarball}" -o "${RUNNER_TEMP}/${tarball}"
          tar -xJf "${RUNNER_TEMP}/${tarball}" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/zig-${arch}-linux-${version}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        if: matrix.zig_target
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}${{ matrix.suffix }}

      # ── Build ──────────────────────────────────────────────────
      # zigbuild pins the glibc symbol baseline, so the -glibc2.17 Linux
      # artifact runs on distros older than the runner (CentOS 7 / Ubuntu
      # 16.04 and up); the -glibc-latest artifact uses the runner's glibc.
      - name: Build (Linux, glibc 2.17)
        if: matrix.zig_target
        run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }}

      - name: Build
        if: ${{ !matrix.zig_target }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ── Package ────────────────────────────────────────────────
      - name: Determine artifact name
        id: artifact
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')}"
          # Strip leading 'v' from tag if present
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=xcom-${version}-${{ matrix.target }}${{ matrix.suffix }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="xcom-${{ steps.artifact.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}"
          mkdir -p "$staging"
          bin="target/${{ matrix.target }}/release/xcom"
          [ -f "$bin" ] || bin="target/${{ matrix.target }}/release/xcom.exe"
          cp "$bin" "$staging/"
          cp LICENSE "$staging/"
          # Include desktop integration files for Linux
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ] && [ "${{ matrix.target }}" != "aarch64-apple-darwin" ]; then
            mkdir -p "$staging/packaging"
            cp packaging/xcom.desktop "$staging/packaging/"
            cp packaging/xcom.png "$staging/packaging/"
            cp packaging/install-user.sh "$staging/packaging/"
            if [ -d packaging/icons ]; then
              mkdir -p "$staging/packaging/icons"
              cp packaging/icons/*.png "$staging/packaging/icons/" 2>/dev/null || true
            fi
          fi
          tar czf "${{ steps.artifact.outputs.archive }}" "$staging"
          echo "Created ${{ steps.artifact.outputs.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          staging="xcom-${{ steps.artifact.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}"
          mkdir -p "$staging"
          bin="target/${{ matrix.target }}/release/xcom.exe"
          [ -f "$bin" ] || bin="target/${{ matrix.target }}/release/xcom"
          cp "$bin" "$staging/"
          cp LICENSE "$staging/"
          tar czf "${{ steps.artifact.outputs.archive }}" "$staging"
          echo "Created ${{ steps.artifact.outputs.archive }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.archive }}
          path: ${{ steps.artifact.outputs.archive }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')"
            echo "tag_name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
